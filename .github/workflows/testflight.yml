name: TestFlight Build & Upload

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # e.g. v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Run UI smoke tests before uploading"
        type: boolean
        default: true

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: UI Smoke Tests (simulator)
  # ─────────────────────────────────────────────
  smoke-test:
    name: Smoke Tests (iPhone 15 Simulator)
    runs-on: macos-14
    if: ${{ github.event.inputs.run_ui_tests != 'false' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Run Smoke Tests
        run: |
          xcodebuild test \
            -project KitchenRecipe.xcodeproj \
            -scheme KitchenRecipe \
            -testPlan SmokeTests \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=17.5" \
            -resultBundlePath TestResults/SmokeTests.xcresult \
            -only-testing:KitchenAppUITests/KitchenAppSmokeTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: TestResults/SmokeTests.xcresult
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 2: Archive & Upload to TestFlight
  # ─────────────────────────────────────────────
  upload-testflight:
    name: Archive & Upload to TestFlight
    runs-on: macos-14
    needs: [smoke-test]
    if: ${{ always() && needs.smoke-test.result != 'failure' }}
    timeout-minutes: 60

    env:
      SCHEME: KitchenRecipe
      ARCHIVE_PATH: build/KitchenRecipe.xcarchive
      EXPORT_PATH: build/KitchenRecipe-ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Import Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/cert.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          PP_UUID=$(security cms -D -i "$PP_PATH" \
            | plutil -extract UUID raw -)

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision

      - name: Set Build Number from Tag
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          xcrun agvtool new-version -all "$BUILD_NUMBER"
          echo "Build number set to $BUILD_NUMBER"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Archive
        run: |
          mkdir -p build
          xcodebuild archive \
            -project KitchenRecipe.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            | xcpretty --color

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Upload to TestFlight via altool
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          IPA_PATH=$(find "$EXPORT_PATH" -name "*.ipa" | head -n 1)
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --verbose

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitchenRecipe-${{ github.ref_name }}.ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Notify on completion
  # ─────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [upload-testflight]
    if: always()

    steps:
      - name: Build Status Summary
        run: |
          if [[ "${{ needs.upload-testflight.result }}" == "success" ]]; then
            echo "✅ TestFlight build ${{ github.ref_name }} uploaded successfully."
          else
            echo "❌ TestFlight build ${{ github.ref_name }} failed."
            exit 1
          fi
